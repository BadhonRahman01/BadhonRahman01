<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img"
     aria-label="The six-stage Quantum-as-a-Service pipeline: developer environment, authentication and submission, cloud and compilation, hardware execution, result return, hybrid loop; a trust boundary separates the client side from the provider side">
<defs>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6d28d9" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#cfd6de" opacity="0.9"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/>
  </marker>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
</defs>
<text x="60" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#656d76">THE QUANTUM-AS-A-SERVICE PIPELINE  ·  WHERE I LOOK FOR TROUBLE</text>
<text x="228.0" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#656d76">client side</text>
<text x="786.0" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#656d76">provider side</text>
<line x1="414.0" y1="58" x2="414.0" y2="236" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 5"/>
