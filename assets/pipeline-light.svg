<line x1="772" y1="119.0" x2="799" y2="119.0" stroke="#656d76" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></line>
