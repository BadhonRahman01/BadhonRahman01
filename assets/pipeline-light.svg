<path d="M 1065.0 154 V 224 H 135.0 V 162" fill="none" stroke="#656d76" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#656d76">hybrid classical–quantum loop: results feed the next iteration</text>
