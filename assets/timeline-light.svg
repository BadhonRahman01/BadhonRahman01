<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img"
     aria-label="Career timeline drawn as a quantum circuit: M.Sc. at LUT University, Software Engineer, Doctoral Researcher at the University of Jyväskylä since 2025, Ph.D. measurement pending">
<defs>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6d28d9" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#cfd6de" opacity="0.9"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/>
  </marker>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
</defs>
<text x="1110" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#656d76">one qubit · three gates · one pending measurement</text>
<text x="100" y="102" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#656d76">|0&#x27E9;</text>
