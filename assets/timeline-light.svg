<line x1="1044" y1="99" x2="1110" y2="99" stroke="#9aa5b4" stroke-width="2"/>
<rect x="262.0" y="69.0" width="116" height="54" rx="9" fill="#ffffff" stroke="#0e7490" stroke-width="2"><animate attributeName="stroke-width" values="2;4.5;2;2" keyTimes="0;0.04;0.1;1" dur="7.0s" begin="1.06s" repeatCount="indefinite"/></rect><text x="320" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0e7490">M.Sc.</text><text x="320" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Software Engineering</text><text x="320" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#656d76">LUT University</text>
<rect x="502.0" y="69.0" width="116" height="54" rx="9" fill="#ffffff" stroke="#0e7490" stroke-width="2"><animate attributeName="stroke-width" values="2;4.5;2;2" keyTimes="0;0.04;0.1;1" dur="7.0s" begin="2.74s" repeatCount="indefinite"/></rect><text x="560" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0e7490">SWE</text><text x="560" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Software Engineer</text><text x="560" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#656d76">industry</text>
