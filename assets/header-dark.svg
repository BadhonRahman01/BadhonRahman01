<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img"
     aria-label="Badhon Rahman, Doctoral Researcher in quantum software security at the University of Jyväskylä">
<defs>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#1c2742" opacity="0.9"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96a8"/>
  </marker>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="318" rx="18" fill="#0b1220" stroke="#1f2a44" stroke-width="1.5"/>
<g clip-path="url(#card)">
  <rect x="1" y="1" width="1198" height="318" fill="url(#dots)"/>
  <circle cx="1010" cy="30" r="360" fill="url(#halo)"/>
  <rect x="1" y="315" width="1198" height="4" fill="url(#accent)"/>
</g>

<!-- left: identity -->
<text x="60" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.5" fill="#22d3ee">DOCTORAL RESEARCHER  ·  QUANTUM SOFTWARE SECURITY</text>
<text x="58" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#e6edf3" letter-spacing="-1">Badhon Rahman</text>
<text x="60" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3">Where the quantum software stack breaks,</text>
<text x="60" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3">and how to make it secure.</text>
<text x="60" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b96a8">Faculty of Information Technology  ·  University of Jyväskylä  ·  Finland</text>

<!-- right: a small circuit crossing the trust boundary -->
